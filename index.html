<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236b7280'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {

  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }

</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">극한환경로봇연구팀</div>
      <h1>워크스테이션 사용 현황</h1>
    </div>
    <div id="conn" class="pill"><span class="dot"></span><span class="t">연결 중…</span></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section id="status" class="card status" aria-live="polite">
    <div class="empty">불러오는 중…</div>
  </section>

  <section class="card">
    <h3 id="formTitle">지금 바로 사용 등록</h3>
    <p class="hint" id="formHint">이름과 사용할 시간을 적으면 지금부터 등록돼요.</p>
    <form id="form" novalidate autocomplete="off">
      <div class="row">
        <label class="field">이름
          <div class="box"><input type="text" id="name" maxlength="20" placeholder="예: 홍길동" required></div>
        </label>
        <label class="field" id="hoursField">사용 시간
          <div class="box"><input type="number" id="hours" inputmode="decimal" min="0.5" max="48" step="0.5" value="2"><span class="unit">시간</span></div>
        </label>
      </div>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-h="1">1시간</button>
        <button type="button" class="chip" data-h="2">2시간</button>
        <button type="button" class="chip" data-h="4">4시간</button>
        <button type="button" class="chip" data-h="8">8시간</button>
        <button type="button" class="chip" data-h="12">12시간</button>
        <button type="button" class="chip" data-h="24">24시간</button>
      </div>
      <div class="submit">
        <button type="submit" class="btn primary" id="submitBtn">사용 등록</button>
        <button type="button" class="btn" id="queueBtn" hidden>대기 등록</button>
        <span class="note" id="submitNote"></span>
      </div>
    </form>
  </section>

  <section id="queueCard" class="card" hidden>
    <h3 id="queueTitle">대기 중</h3>
    <p class="hint" id="queueHint"></p>
    <ul class="list" id="queue"></ul>
  </section>

  <section class="card">
    <details id="historyBox">
      <summary>최근 사용 기록 <span class="cnt" id="historyCnt"></span></summary>
      <ul class="list" id="history"></ul>
    </details>
  </section>

  <footer>
    <div class="footactions">
      <button class="btn sm" id="mailBtn" type="button">비면 메일 받기</button>
      <button class="btn sm" id="notifyBtn" type="button">브라우저 알림</button>
    </div>
    <span id="sync"></span>
    <form class="mailrow" id="mailForm" novalidate autocomplete="off" hidden>
      <input type="email" id="mailInput" maxlength="100" placeholder="메일 주소 (비면 한 번만 보내드려요)" required>
      <button type="submit" class="btn sm" id="mailSubmit">등록</button>
    </form>
  </footer>
</div>
<div id="toast" role="status"></div>

<script type="module">
// ============================================================
//  ▼▼▼ 1) Firebase 설정: 이 블록 전체를 Firebase 콘솔에서 복사한
//         "const firebaseConfig = { ... };" 로 바꿔 주세요.
//         (README.md 의 4번 단계 참고)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyD28D1F50IHQrrrFOqzsUN9XEzU2DJQQRs",
  authDomain: "workstation-5d524.firebaseapp.com",
  databaseURL: "https://workstation-5d524-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "workstation-5d524",
  storageBucket: "workstation-5d524.firebasestorage.app",
  messagingSenderId: "810492914985",
  appId: "1:810492914985:web:68e69c6bae2c79cd6c9b38"
};
// ============================================================
//  ▲▲▲ 여기까지 교체
// ============================================================

// 2) 필요하면 바꿔 쓰는 값들
const SETTINGS = {
  minHours: 0.5,       // 최소 사용 시간
  maxHours: 48,        // 최대 사용 시간 (연장 포함 상한)
  historyLimit: 20,    // 최근 기록 보관 개수
  firebaseVersion: "12.18.0",
};

// @logic-start  (순수 로직: 테스트에서 그대로 가져다 씀)
const HOUR = 3600000, MIN = 60000;
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function toList(v) { if (!v) return []; return (Array.isArray(v) ? v : Object.values(v)).filter(Boolean); }
function validCurrent(c) { return !!(c && typeof c === 'object' && c.name && typeof c.start === 'number' && typeof c.end === 'number'); }

// 저장된 보드(raw)를 '지금(now)' 기준으로 정리한다.
//  - 시간이 끝난 사용은 기록으로 옮긴다.
//  - 대기자는 자동으로 시작되지 않는다. 비어 있어도 명단에 남아 있고,
//    본인이 직접 '사용 시작'을 눌러야 시작된다 (새벽에 타이머가 도는 것을 막기 위함).
//  - changed: DB에 반영해야 할 변화가 있었는지
function normalize(raw, now, limit = 20) {
  const r = raw && typeof raw === 'object' ? raw : {};
  const b = {
    current: validCurrent(r.current) ? { ...r.current } : null,
    queue: toList(r.queue).filter(q => q && q.name)
      .sort((a, c) => (a.createdAt || 0) - (c.createdAt || 0) || String(a.id).localeCompare(String(c.id))),
    history: toList(r.history).filter(h => h && h.name && typeof h.end === 'number'),
  };
  let changed = r.current && !b.current ? true : false;
  if (b.current && b.current.end <= now) {
    b.history.push({ id: b.current.id || genId(), name: b.current.name, start: b.current.start, end: b.current.end, endedBy: b.current.endedBy || 'expired' });
    b.current = null;
    changed = true;
  }
  b.history.sort((a, c) => a.end - c.end || String(a.id).localeCompare(String(c.id)));
  if (b.history.length > limit) { b.history = b.history.slice(-limit); changed = true; }
  return { board: b, changed };
}

// 정리된 보드를 DB에 저장하는 모양(객체 키 = id)으로 바꾼다.
function toDb(b) {
  const queue = {}, history = {};
  b.queue.forEach(q => { queue[q.id] = q; });
  b.history.forEach(h => { history[h.id] = h; });
  return { current: b.current || null, queue, history };
}

// @logic-end

// ---------- 저장소 어댑터 ----------
function prune(v) {           // Firebase 처럼 null / 빈 객체는 지운다
  if (v === null || v === undefined) return null;
  if (Array.isArray(v)) v = Object.assign({}, v);
  if (typeof v !== 'object') return v;
  const o = {};
  for (const [k, x] of Object.entries(v)) { const p = prune(x); if (p !== null) o[k] = p; }
  return Object.keys(o).length ? o : null;
}
function memoryAdapter() {
  let data = null; const subs = new Set();
  const emit = () => subs.forEach(cb => cb(structuredClone(data)));
  return {
    kind: 'demo', serverOffset: 0,
    subscribe(cb) { subs.add(cb); queueMicrotask(() => cb(structuredClone(data))); return () => subs.delete(cb); },
    async transact(fn) {
      const next = fn(structuredClone(data));
      if (next === undefined) return { committed: false, value: structuredClone(data) };
      data = prune(structuredClone(next)); emit();
      return { committed: true, value: structuredClone(data) };
    },
    onConnection(cb) { cb(true); },
    async addSubscriber() { /* 데모 모드에서는 저장하지 않음 */ },
  };
}
async function firebaseAdapter(config) {
  const v = SETTINGS.firebaseVersion;
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  const { getDatabase, ref, onValue, runTransaction, push, set } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-database.js`);
  const db = getDatabase(initializeApp(config));
  const boardRef = ref(db, 'board');
  const a = {
    kind: 'firebase', serverOffset: 0,
    subscribe(cb, onErr) { return onValue(boardRef, s => cb(s.val()), e => onErr && onErr(e)); },
    async transact(fn) { const r = await runTransaction(boardRef, fn); return { committed: r.committed, value: r.snapshot.val() }; },
    async addSubscriber(email) { await set(push(ref(db, 'subscribers')), { email, createdAt: Date.now() }); },
    onConnection(cb) { onValue(ref(db, '.info/connected'), s => cb(!!s.val())); },
  };
  onValue(ref(db, '.info/serverTimeOffset'), s => { a.serverOffset = s.val() || 0; });
  return a;
}

// ---------- 상태 & 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const state = { raw: null, loaded: false, mode: 'demo', lastSync: null, myName: '', wasBusy: null, notif: false, warnedId: null, confirmRelease: false, lastKey: '', busyBtn: false, startingId: null };
let adapter = null, persistTimer = null;
const serverNow = () => Date.now() + (adapter ? adapter.serverOffset : 0);

function fmtClock(ts) {
  const d = new Date(ts), n = new Date(serverNow());
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return d.toDateString() === n.toDateString() ? t : `${d.getMonth() + 1}/${d.getDate()} ${t}`;
}
function fmtDuration(ms) {
  let m = Math.round(ms / MIN), h = Math.floor(m / 60); m -= h * 60;
  if (h && m) return `${h}시간 ${m}분`; if (h) return `${h}시간`; return `${m}분`;
}
function fmtRemain(ms) {
  if (ms <= 0) return '0초';
  if (ms >= HOUR) { const mins = Math.ceil(ms / MIN); const h = Math.floor(mins / 60), m = mins % 60; return m ? `${h}시간 ${m}분` : `${h}시간`; }
  const m = Math.floor(ms / MIN), s = Math.floor((ms % MIN) / 1000);
  return m ? `${m}분 ${pad(s)}초` : `${s}초`;
}
function fmtHours(h) { return fmtDuration(h * HOUR); }
let toastTimer;
function toast(msg, type = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 3800);
}
function setFavicon(color) {
  $('#favicon').href = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='${encodeURIComponent(color)}'/%3E%3C/svg%3E`;
}
function notify(title, body) {
  try { if (state.notif && Notification.permission === 'granted') new Notification(title, { body }); } catch (e) { /* 무시 */ }
}

// ---------- 렌더링 ----------
function render() {
  const now = serverNow();
  if (!state.loaded) return;
  const { board, changed } = normalize(state.raw, now, SETTINGS.historyLimit);
  const cur = board.current;
  const key = JSON.stringify([cur && cur.id, cur && cur.end, board.queue.map(q => q.id), board.history.length, !cur, state.startingId]);
  const boardChanged = key !== state.lastKey;
  if (boardChanged) { state.lastKey = key; state.confirmRelease = false; }

  // 상태 카드
  const st = $('#status');
  if (!cur) {
    const waiting = board.queue.length;
    st.innerHTML = `
      <div class="head"><span class="badge free">사용 가능</span>${waiting ? `<span class="since">대기자 ${waiting}명</span>` : ''}</div>
      <h2 class="who">현재 사용자 없음</h2>
      <div class="meta">${waiting
        ? `대기 명단에 <b>${esc(board.queue[0].name)}</b>님${waiting > 1 ? ` 외 ${waiting - 1}명` : ''}이 있어요. 아래에서 협의 후 시작해 주세요.`
        : '지금 바로 등록하고 사용할 수 있어요.'}</div>`;
    document.title = `[사용 가능] 워크스테이션 · 극한환경로봇연구팀`;
    setFavicon('#22c55e');
  } else {
    const remain = cur.end - now, total = Math.max(1, cur.end - cur.start);
    const pct = Math.min(100, Math.max(0, (now - cur.start) / total * 100));
    const urgent = remain <= 10 * MIN;
    const actions = state.confirmRelease
      ? `<div class="confirm"><span><b>${esc(cur.name)}</b>님의 사용을 지금 종료할까요?</span>
           <button class="btn danger solid sm" data-act="release-yes">종료하기</button>
           <button class="btn sm" data-act="release-no">취소</button></div>`
      : `<div class="actions">
           <button class="btn danger" data-act="release">사용 종료</button>
           <span class="lbl">연장</span>
           <button class="btn" data-act="extend" data-ms="${30 * MIN}">+30분</button>
           <button class="btn" data-act="extend" data-ms="${HOUR}">+1시간</button>
           <button class="btn" data-act="extend" data-ms="${2 * HOUR}">+2시간</button>
         </div>`;
    st.innerHTML = `
      <div class="head"><span class="badge busy">사용 중</span><span class="since">${fmtClock(cur.start)}부터 · ${fmtDuration(total)}</span></div>
      <h2 class="who">${esc(cur.name)}<small>사용 중</small></h2>
      <div class="remain${urgent ? ' urgent' : ''}"><strong>${fmtRemain(remain)}</strong> 남음</div>
      <div class="bar${urgent ? ' urgent' : ''}"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="meta">종료 예정 <b>${fmtClock(cur.end)}</b>${board.queue.length ? ` · 대기 ${board.queue.length}명` : ''}</div>
      ${actions}`;
    document.title = `[${fmtRemain(remain)} · ${cur.name}] 워크스테이션 · 극한환경로봇연구팀`;
    setFavicon(urgent ? '#ef4444' : '#f59e0b');
  }

  // 입력 폼 문구 (사용 중이면 이름만 받는 대기 등록으로 바뀐다)
  $('#hoursField').hidden = !!cur;
  $('#chips').hidden = !!cur;
  $('#queueBtn').hidden = !!cur || !board.queue.length;
  if (!cur) {
    const waiting = board.queue.length;
    $('#formTitle').textContent = waiting ? '지금 쓰기 · 또는 줄 서기' : '지금 바로 사용 등록';
    $('#formHint').textContent = waiting
      ? `대기자 ${waiting}명이 있어요. 협의됐으면 바로 쓰고, 아니면 대기 등록으로 줄을 서세요.`
      : '이름과 사용할 시간을 적으면 지금부터 등록돼요.';
    $('#submitBtn').textContent = '사용 등록';
    $('#submitNote').textContent = waiting ? '대기 등록은 시간 없이 이름만 올라가요.' : '';
  } else {
    $('#formTitle').textContent = '다음 예약 (대기 등록)';
    $('#formHint').textContent = '지금은 사용 중이에요.';
    $('#submitBtn').textContent = '대기 등록';
    $('#submitNote').textContent = '이름만 올려두면 돼요. 비면 직접 시작하세요.';
  }

  // 대기열 / 기록 (보드가 바뀔 때만)
  if (boardChanged) {
    const qc = $('#queueCard');
    if (board.queue.length) {
      qc.hidden = false;
      $('#queueTitle').textContent = `대기 중 · ${board.queue.length}명`;
      $('#queueHint').textContent = cur
        ? '순서는 참고용이에요. 앞사람이 끝나도 자동으로 시작되지 않으니, 비면 직접 시작하세요.'
        : '지금 비어 있어요. 협의된 분이 시간을 정해 시작하면 됩니다.';
      $('#queue').innerHTML = board.queue.map((q, i) => {
        const opening = !cur && state.startingId === q.id;
        const acts = opening
          ? `<div class="qstart">
               <input type="number" class="qh" id="qh-${esc(q.id)}" inputmode="decimal" min="${SETTINGS.minHours}" max="${SETTINGS.maxHours}" step="0.5" value="2" aria-label="사용 시간">
               <span class="unitp">시간</span>
               <button type="button" class="chip" data-act="qchip" data-id="${esc(q.id)}" data-h="1">1</button>
               <button type="button" class="chip" data-act="qchip" data-id="${esc(q.id)}" data-h="2">2</button>
               <button type="button" class="chip" data-act="qchip" data-id="${esc(q.id)}" data-h="4">4</button>
               <button type="button" class="chip" data-act="qchip" data-id="${esc(q.id)}" data-h="8">8</button>
               <button class="btn sm primary" data-act="start-go" data-id="${esc(q.id)}">시작</button>
               <button class="btn ghost sm" data-act="start-cancel">닫기</button>
             </div>`
          : `${!cur ? `<button class="btn sm" data-act="start" data-id="${esc(q.id)}">사용 시작</button>` : ''}
             <button class="btn ghost sm" data-act="cancel" data-id="${esc(q.id)}">대기 취소</button>`;
        return `<li><span class="num">${i + 1}</span>
          <div class="grow"><div class="n">${esc(q.name)}</div><div class="d">${q.createdAt ? `${fmtClock(q.createdAt)} 등록` : '대기 중'}</div></div>
          ${acts}</li>`;
      }).join('');
    } else { qc.hidden = true; $('#queue').innerHTML = ''; state.startingId = null; }

    const hist = board.history.slice().reverse();
    $('#historyCnt').textContent = hist.length ? `${hist.length}건` : '';
    $('#history').innerHTML = hist.length ? hist.map(h => `
      <li><div class="grow"><div class="n">${esc(h.name)}</div><div class="d">${fmtClock(h.start)} → ${fmtClock(h.end)} · ${fmtDuration(h.end - h.start)}</div></div>
        <span class="tag ${h.endedBy === 'released' ? 'released' : ''}">${h.endedBy === 'released' ? '직접 종료' : '시간 만료'}</span></li>`).join('')
      : '<li class="empty">아직 기록이 없어요.</li>';
  }

  // 알림 (비었을 때 / 내 시간 10분 전)
  const busy = !!cur;
  if (state.wasBusy === true && !busy) notify('워크스테이션이 비었어요', '지금 바로 등록할 수 있어요.');
  if (busy && cur.name === state.myName && cur.end - now <= 10 * MIN && cur.end - now > 0 && state.warnedId !== cur.id) {
    state.warnedId = cur.id; notify('내 사용 시간이 10분 남았어요', '더 필요하면 연장 버튼을 눌러 주세요.');
  }
  state.wasBusy = busy;

  if (changed) schedulePersist();
  $('#sync').textContent = state.lastSync ? `마지막 동기화 ${pad(state.lastSync.getHours())}:${pad(state.lastSync.getMinutes())}:${pad(state.lastSync.getSeconds())}` : '';
}

// 시간이 지나 바뀐 상태를 (아무 클라이언트나 하나가) DB에 반영
let persistFailUntil = 0;
function schedulePersist() {
  if (persistTimer || Date.now() < persistFailUntil) return;
  persistTimer = setTimeout(async () => {
    persistTimer = null;
    try {
      await adapter.transact(raw => { const r = normalize(raw, serverNow(), SETTINGS.historyLimit); return r.changed ? toDb(r.board) : undefined; });
    } catch (e) { console.warn('persist failed', e); persistFailUntil = Date.now() + 30000; }   // 실패하면 30초 뒤 재시도
  }, 400 + Math.random() * 2500);
}

// ---------- 동작 ----------
async function withBusy(fn) {
  if (state.busyBtn) return; state.busyBtn = true;
  $('#submitBtn').disabled = true; $('#queueBtn').disabled = true;
  try { await fn(); } catch (e) { console.error(e); toast('처리에 실패했어요: ' + (e && e.message ? e.message : e), 'error'); }
  finally { state.busyBtn = false; $('#submitBtn').disabled = false; $('#queueBtn').disabled = false; }
}

// 이름칸을 읽고 비어 있으면 흔들어서 알려준다
function readName() {
  const el = $('#name'), v = el.value.trim();
  if (!v) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); el.focus(); toast('이름을 입력해 주세요'); return null; }
  return v;
}

// 시간 없이 이름만 대기 명단에 올린다 (사용 중일 때 / 비었는데 줄 설 때 공용)
async function joinQueue(name) {
  const now = serverNow(), id = genId();
  await adapter.transact(raw => {
    const { board } = normalize(raw, now, SETTINGS.historyLimit);
    board.queue.push({ id, name, createdAt: now });
    return toDb(board);
  });
  state.myName = name; $('#name').value = '';
  toast(`${name}님을 대기 명단에 올렸어요. 비면 직접 시작해 주세요`);
}

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const nameEl = $('#name'), hoursEl = $('#hours');
  const name = readName(); if (!name) return;
  const isFree = !normalize(state.raw, serverNow()).board.current;
  if (!isFree) { withBusy(() => joinQueue(name)); return; }

  const hours = Math.round(parseFloat(hoursEl.value) * 100) / 100;
  if (!(hours >= SETTINGS.minHours && hours <= SETTINGS.maxHours)) { hoursEl.classList.add('shake'); setTimeout(() => hoursEl.classList.remove('shake'), 400); hoursEl.focus(); return toast(`사용 시간은 ${SETTINGS.minHours}~${SETTINGS.maxHours}시간 사이로 적어 주세요`); }
  withBusy(async () => {
    const now = serverNow(), id = genId();
    const res = await adapter.transact(raw => {
      const { board } = normalize(raw, now, SETTINGS.historyLimit);
      if (!board.current) board.current = { id, name, start: now, end: now + hours * HOUR };
      else board.queue.push({ id, name, createdAt: now });
      return toDb(board);
    });
    const v = res.value || {};
    state.myName = name; nameEl.value = '';
    if (v.current && v.current.id === id) toast(`${name}님, 지금부터 ${fmtHours(hours)} 사용 등록됐어요 (종료 예정 ${fmtClock(now + hours * HOUR)})`);
    else toast(`방금 다른 사람이 먼저 등록해서 ${name}님은 대기 명단에 넣었어요`);
  });
});

$('#queueBtn').addEventListener('click', () => {
  const name = readName(); if (!name) return;
  withBusy(() => joinQueue(name));
});

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('#hours').value = b.dataset.h; syncChips();
});
function syncChips() { const v = parseFloat($('#hours').value); document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', parseFloat(c.dataset.h) === v)); }
$('#hours').addEventListener('input', syncChips); syncChips();

$('#status').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'release') { state.confirmRelease = true; render(); return; }
  if (act === 'release-no') { state.confirmRelease = false; render(); return; }
  if (act === 'release-yes') {
    state.confirmRelease = false;
    withBusy(async () => {
      const now = serverNow(); let ended = null;
      const res = await adapter.transact(raw => {
        const { board } = normalize(raw, now, SETTINGS.historyLimit);
        if (!board.current) return;                       // 이미 비어 있음
        board.current.end = now; board.current.endedBy = 'released';
        return toDb(normalize(board, now, SETTINGS.historyLimit).board);
      });
      if (!res.committed) return toast('이미 비어 있어요');
      const v = res.value || {};
      toast(v.current ? `사용을 종료했어요. 이제 ${v.current.name}님 차례예요` : '사용을 종료했어요. 이제 비어 있어요');
    });
    return;
  }
  if (act === 'extend') {
    const ms = parseInt(b.dataset.ms, 10);
    withBusy(async () => {
      const now = serverNow();
      const res = await adapter.transact(raw => {
        const { board } = normalize(raw, now, SETTINGS.historyLimit);
        if (!board.current) return;
        board.current.end = Math.min(board.current.end + ms, now + SETTINGS.maxHours * HOUR);
        return toDb(board);
      });
      if (!res.committed) return toast('지금은 사용 중인 사람이 없어요');
      toast(`${fmtDuration(ms)} 연장했어요 (종료 예정 ${fmtClock(res.value.current.end)})`);
    });
  }
});

$('#queue').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  if (act === 'start') { state.startingId = id; render(); return; }
  if (act === 'start-cancel') { state.startingId = null; render(); return; }
  if (act === 'qchip') { const f = $(`#qh-${CSS.escape(id)}`); if (f) f.value = b.dataset.h; return; }

  if (act === 'cancel') {
    withBusy(async () => {
      const res = await adapter.transact(raw => {
        const { board } = normalize(raw, serverNow(), SETTINGS.historyLimit);
        const n = board.queue.length; board.queue = board.queue.filter(q => q.id !== id);
        if (board.queue.length === n) return;
        return toDb(board);
      });
      if (state.startingId === id) state.startingId = null;
      toast(res.committed ? '대기를 취소했어요' : '이미 시작됐거나 취소된 대기예요');
    });
    return;
  }

  if (act === 'start-go') {
    const f = $(`#qh-${CSS.escape(id)}`);
    const hours = Math.round(parseFloat(f && f.value) * 100) / 100;
    if (!(hours >= SETTINGS.minHours && hours <= SETTINGS.maxHours)) {
      if (f) { f.classList.add('shake'); setTimeout(() => f.classList.remove('shake'), 400); f.focus(); }
      return toast(`사용 시간은 ${SETTINGS.minHours}~${SETTINGS.maxHours}시간 사이로 적어 주세요`);
    }
    withBusy(async () => {
      const now = serverNow();
      let picked = null, blocked = false;
      const res = await adapter.transact(raw => {
        const { board } = normalize(raw, now, SETTINGS.historyLimit);
        if (board.current) { blocked = true; return; }
        const q = board.queue.find(x => x.id === id);
        if (!q) return;
        picked = q;
        board.queue = board.queue.filter(x => x.id !== id);
        board.current = { id: q.id, name: q.name, start: now, end: now + hours * HOUR };
        return toDb(board);
      });
      state.startingId = null;
      if (blocked) return toast('방금 다른 사람이 먼저 시작했어요', 'error');
      if (!res.committed || !picked) return toast('이미 시작됐거나 취소된 대기예요', 'error');
      state.myName = picked.name;
      toast(`${picked.name}님, 지금부터 ${fmtHours(hours)} 사용 시작됐어요 (종료 예정 ${fmtClock(now + hours * HOUR)})`);
    });
  }
});

$('#notifyBtn').addEventListener('click', async () => {
  if (!('Notification' in window)) return toast('이 브라우저는 알림을 지원하지 않아요');
  if (state.notif) { state.notif = false; $('#notifyBtn').classList.remove('on'); $('#notifyBtn').textContent = '브라우저 알림'; return; }
  const p = await Notification.requestPermission();
  if (p !== 'granted') return toast('브라우저 알림이 차단되어 있어요. 주소창 옆 설정에서 허용해 주세요', 'error');
  state.notif = true; $('#notifyBtn').classList.add('on'); $('#notifyBtn').textContent = '알림 켜짐';
  toast('이 탭이 열려 있는 동안 워크스테이션이 비면 알려드릴게요');
});

const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
$('#mailBtn').addEventListener('click', () => {
  const f = $('#mailForm');
  f.hidden = !f.hidden;
  if (!f.hidden) $('#mailInput').focus();
});
$('#mailForm').addEventListener('submit', async e => {
  e.preventDefault();
  const input = $('#mailInput');
  const email = input.value.trim();
  if (!EMAIL_RE.test(email) || email.length > 100) {
    input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');

  }
  const btn = $('#mailSubmit');
  btn.disabled = true;
  try {
    await adapter.addSubscriber(email);
    input.value = '';
    $('#mailForm').hidden = true;
    $('#mailBtn').classList.add('on');
    $('#mailBtn').textContent = '메일 등록됨';
    toast(state.mode === 'demo' ? '데모 모드라 실제로 등록되지는 않아요' : '워크스테이션이 비면 메일로 한 번 알려드릴게요');
  } catch (err) {
    console.error(err);
    toast('등록에 실패했어요. 잠시 후 다시 시도해 주세요', 'error');
  } finally {
    btn.disabled = false;
  }
});

// ---------- 시작 ----------
function setConn(kind, text) { const c = $('#conn'); c.className = 'pill ' + kind; c.querySelector('.t').textContent = text; }
function showBanner(html, error = false) { const b = $('#banner'); b.innerHTML = html; b.className = 'banner' + (error ? ' error' : ''); b.hidden = false; }

const isPlaceholder = v => !v || /여기에|PASTE|YOUR_/i.test(String(v));
const forceDemo = new URLSearchParams(location.search).has('demo');
const configured = !isPlaceholder(firebaseConfig.apiKey) && !isPlaceholder(firebaseConfig.projectId);
const hasDbUrl = !isPlaceholder(firebaseConfig.databaseURL) && /^https:\/\//.test(firebaseConfig.databaseURL || '');

async function start() {
  if (forceDemo || !configured || !hasDbUrl) {
    state.mode = 'demo';
    adapter = memoryAdapter();
    window.__demo = { advance(ms) { adapter.serverOffset += ms; render(); } };
    if (configured && !hasDbUrl) {
      showBanner(`<strong>databaseURL 이 비어 있어요</strong> Firebase 콘솔 → Realtime Database 화면 위쪽의 주소(<code>https://…firebasedatabase.app</code>)를 복사해서 <code>firebaseConfig</code> 의 <code>databaseURL</code> 에 넣어 주세요. 그 전까지는 데모 모드로만 동작해요.`, true);
    } else if (!forceDemo) {
      showBanner(`<strong>데모 모드 (아직 Firebase 설정 전)</strong> 지금은 이 화면 안에서만 동작하고, 새로고침하면 초기화돼요. 다른 사람과 공유하려면 <code>README.md</code> 순서대로 Firebase 설정값을 <code>index.html</code> 에 붙여 넣어 주세요.`);
    } else {
      showBanner(`<strong>데모 모드</strong> 이 화면 안에서만 동작해요 (새로고침하면 초기화).`);
    }
    setConn('demo', '데모 모드');
  } else {
    state.mode = 'firebase';
    try { adapter = await firebaseAdapter(firebaseConfig); }
    catch (e) {
      console.error(e);
      showBanner(`<strong>Firebase 연결에 실패했어요</strong> 인터넷 연결과 <code>firebaseConfig</code> 값을 확인해 주세요. (${esc(e.message || e)})`, true);
      setConn('off', '연결 실패'); return;
    }
    let everConnected = false;
    adapter.onConnection(ok => {
      if (ok) everConnected = true;
      setConn(ok ? 'on' : (everConnected ? 'off' : ''), ok ? '실시간 연결됨' : (everConnected ? '연결 끊김 · 재연결 중' : '연결 중…'));
    });
  }
  adapter.subscribe(v => { state.raw = v; state.loaded = true; state.lastSync = new Date(); render(); },
    err => { console.error(err); showBanner(`<strong>데이터베이스 권한 오류</strong> Firebase 콘솔 → Realtime Database → <b>규칙</b> 탭에 <code>database.rules.json</code> 내용을 붙여넣고 <b>게시</b>했는지 확인해 주세요. (${esc(err.message || err)})`, true); setConn('off', '권한 오류'); });
  setInterval(render, 1000);
}
start();
</script>
</body>
</html>
